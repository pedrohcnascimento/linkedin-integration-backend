name: Security & Verification CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test-and-dependency-check:
    name: Maven Test & OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit and integration test suite
        run: mvn -B verify

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          EXTRA_ARGS=()
          if [ -n "${NVD_API_KEY:-}" ]; then
            EXTRA_ARGS+=("-DnvdApiKey=${NVD_API_KEY}")
          fi
          mvn -B org.owasp:dependency-check-maven:12.1.0:check \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML,JSON \
            "${EXTRA_ARGS[@]}"

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL SAST (Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@45775bd8235c68ba998cffa51713cbe4d58ce0c3 # v3.28.11
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@45775bd8235c68ba998cffa51713cbe4d58ce0c3 # v3.28.11

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@45775bd8235c68ba998cffa51713cbe4d58ce0c3 # v3.28.11
