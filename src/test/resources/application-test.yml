spring:
  datasource:
    url: "jdbc:sqlite::memory:"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Configurações mockadas para ambiente de testes
app:
  linkedin:
    client-id: "test-client-id"
    client-secret: "test-client-secret"
    redirect-uri: "http://localhost:8080/api/v1/linkedin/oauth/callback"
  security:
    token-encryption-key: "test-encryption-key-which-is-at-least-32-chars-long"
    cors-allowed-origins: "http://localhost:5173"
  base-url: "http://localhost:8080"
