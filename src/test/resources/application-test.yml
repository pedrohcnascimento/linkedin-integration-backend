springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  health:
    redis:
      enabled: false

spring:
  datasource:
    url: "jdbc:sqlite::memory:"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Configurações mockadas para ambiente de testes
app:
  linkedin:
    client-id: "test-client-id"
    client-secret: "test-client-secret"
    redirect-uri: "http://localhost:8080/api/v1/linkedin/oauth/callback"
    scopes: "openid profile w_member_social"
  security:
    token-encryption-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    cors-allowed-origins: "http://localhost:5173"
  rate-limit:
    hmac-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  base-url: "http://localhost:8080"

management:
  health:
    redis:
      enabled: false
