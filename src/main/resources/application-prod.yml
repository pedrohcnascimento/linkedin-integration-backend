# Perfil de Produção
# Em produção, exigimos que as variáveis de ambiente sejam fornecidas pelo ambiente.
# Sem defaults de fallback para senhas ou segredos (vão falhar se ausentes, o que é o esperado).

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false
  data:
    redis:
      url: ${RATE_LIMIT_REDIS_URL}
  flyway:
    locations: classpath:db/migration/oracle
  datasource:
    # Oracle no perfil prod; o perfil local continua usando SQLite.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    
    # HikariCP configurações para produção
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      # NUNCA usar update em prod
      ddl-auto: validate
    show-sql: false

# Segurança e Integração
app:
  rate-limit:
    hmac-key: ${RATE_LIMIT_HMAC_KEY}
    redis-key-prefix: linkedin-integration
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID}
    client-secret: ${LINKEDIN_CLIENT_SECRET}
    redirect-uri: ${LINKEDIN_REDIRECT_URI}
    scopes: ${LINKEDIN_SCOPES:openid profile w_member_social}
    api-base-url: ${LINKEDIN_API_BASE_URL:https://api.linkedin.com}
    api-version: ${LINKEDIN_API_VERSION:202609}
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  base-url: ${APP_BASE_URL}

logging:
  level:
    root: INFO
    com.example.linkedinagent: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
