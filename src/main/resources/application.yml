spring:
  application:
    name: linkedin-integration-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  data:
    redis:
      repositories:
        enabled: false

  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
  tomcat:
    max-swallow-size: 64KB
    max-http-form-post-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

logging:
  pattern:
    level: "%5p [req:%X{requestId:-none}]"

app:
  retention:
    audit-event-retention: ${AUDIT_EVENT_RETENTION:P90D}
    oauth-cleanup-interval-ms: ${OAUTH_CLEANUP_INTERVAL_MS:900000}
  scheduling:
    grace-window: ${SCHEDULED_PUBLISH_GRACE_WINDOW:PT60M}
    poll-interval-ms: ${SCHEDULED_PUBLISH_POLL_INTERVAL_MS:30000}
    initial-delay-ms: ${SCHEDULED_PUBLISH_INITIAL_DELAY_MS:30000}
    batch-size: ${SCHEDULED_PUBLISH_BATCH_SIZE:20}
